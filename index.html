<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Samara Care"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Samara Care</title><style>
:root{--primary:#176b5b;--primary2:#0f4f43;--bg:#f4f7f6;--card:#fff;--text:#17201e;--muted:#66736f;--line:#dfe8e5;--danger:#b42318;--warn:#b54708;--ok:#067647;--info:#175cd3;--shadow:0 8px 28px rgba(20,54,47,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e8f4f0,#f8fbfa)}.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:var(--shadow)}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.field{margin-top:18px}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary{background:var(--primary);color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700}.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);padding:10px 14px;border-radius:10px}.danger{background:#fff0ee;color:var(--danger);border:1px solid #ffc9c2;padding:9px 12px;border-radius:9px}.login .primary{width:100%;margin-top:20px}.demo{margin-top:18px;padding:12px;background:#f3f8f6;border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#123f36;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.side-brand{padding:8px 10px 22px}.side-brand h2{margin:0}.side-brand small{opacity:.72}.nav button{width:100%;text-align:left;background:transparent;color:#d8e9e4;border:0;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#1d5b4e;color:#fff}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;background:#e6f1ee;color:var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:800}.content{padding:24px}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.page-title h2{margin:0}.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 14px rgba(20,54,47,.04)}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:28px;font-weight:800;margin-top:8px}.metric .sub{font-size:12px;margin-top:5px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--danger)}.info{color:var(--info)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.section h3{margin:0 0 14px}.list{display:flex;flex-direction:column;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;background:#edf3f1}.tag.red{background:#fee4e2;color:#b42318}.tag.amber{background:#fef0c7;color:#b54708}.tag.green{background:#dcfae6;color:#067647}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f7faf9;color:#4c5d58}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(10,25,21,.48);display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:#eef4f2;border-radius:50%;width:34px;height:34px}.bed-grid{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:10px}.bed{padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff}.bed.occupied{background:#fff1ef;border-color:#ffc9c2}.bed.available{background:#effaf5;border-color:#abefc6}.bed small{display:block;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;white-space:nowrap}.tabs button.active{background:var(--primary);color:#fff}.notice{padding:12px 14px;border-radius:10px;background:#eef7f4;border:1px solid #cce4dc;margin-bottom:14px}.right{text-align:right}.empty{padding:30px;text-align:center;color:var(--muted)}.install-btn{background:#e8f4f0;color:var(--primary);border:1px solid #b9dcd3;padding:9px 12px;border-radius:9px;font-weight:700}.install-banner{position:fixed;left:16px;right:16px;bottom:80px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:12px;align-items:center}.install-banner b{display:block}.install-banner small{color:var(--muted)}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.app{grid-template-columns:78px 1fr}.side-brand h2,.side-brand small,.nav span{display:none}.sidebar{padding:12px 8px}.nav button{text-align:center}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;height:64px;width:100%;z-index:10;display:flex;padding:5px;background:#123f36}.side-brand{display:none}.nav{display:flex;width:100%;overflow:auto}.nav button{min-width:78px;font-size:11px;padding:7px}.content{padding:16px 12px 82px}.topbar{padding:0 12px}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.bed-grid{grid-template-columns:repeat(2,1fr)}.page-title{align-items:flex-start}.page-title h2{font-size:21px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=7"></script></head><body>
<section id="loginView" class="login"><div class="login-card"><div class="brand"><div class="logo">SC</div><div><h1>Samara Care</h1><p>Shared Assisted Living Management System</p></div></div><div class="field"><label>Login ID</label><input id="loginId"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" onkeydown="if(event.key==='Enter')login()"></div><button class="primary" onclick="login()">Sign in</button><div class="demo" id="loginHelp"><b>Live cloud system</b><br>Accounts and operational records are shared securely across authorised devices.</div></div></section>
<section id="appView" class="app hidden"><aside class="sidebar"><div class="side-brand"><h2>Samara Care</h2><small>25-bed assisted living</small></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="topbar"><div><b id="topTitle">Dashboard</b><div class="muted" style="font-size:12px" id="today"></div></div><div class="userbox"><div class="avatar" id="avatar">A</div><div><b id="userName"></b><div class="muted" style="font-size:12px" id="userRole"></div></div><button id="syncState" class="mini">Live</button><button class="mini" onclick="changeMyPassword()">Password</button><button class="mini" onclick="logout()">Logout</button></div></header><div class="content" id="content"></div></main></section><div id="modalRoot"></div>
<script>
const CFG=window.SAMARA_CONFIG||{};
const ENABLED=!!(CFG.cloudMode&&CFG.supabaseUrl&&CFG.supabaseAnonKey);
window.SAMARA_DB=ENABLED?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let me=null,page='dashboard',USERS={},patients=[],care=[],vitals=[],meds=[],meals=[],bills=[],channel=null;
const access={Admin:['dashboard','patients','beds','care','vitals','medicines','food','billing','employees','reports'],Manager:['dashboard','patients','beds','care','vitals','medicines','food','billing','reports'],Nurse:['dashboard','patients','care','vitals','medicines','food','reports'],Caregiver:['dashboard','patients','care','food'],Accounts:['dashboard','patients','billing','reports'],Kitchen:['dashboard','food']};
const labels={dashboard:'Dashboard',patients:'Patients',beds:'Rooms & Beds',care:'Daily Care',vitals:'Vital Signs',medicines:'Medicines',food:'Food & Diet',billing:'Billing',employees:'Employees',reports:'Reports'};
const email=id=>`${String(id).trim().toLowerCase()}@users.samaracare.local`;const $=id=>document.getElementById(id);const val=id=>$(id)?.value||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function who(id){return USERS[id]?.name||'Staff'} function pName(id){return patients.find(p=>p.id===id)?.full_name||'Patient'} function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')} function dt(s){return s?new Date(s).toLocaleString('en-IN'):''}
async function profile(uid){const {data,error}=await window.SAMARA_DB.from('profiles').select('*').eq('id',uid).single();if(error)throw error;return {uid:data.id,id:data.login_id,name:data.full_name,role:data.role,active:data.active}}
async function login(){if(!ENABLED)return alert('Add Supabase details in config.js');const b=document.querySelector('#loginView .primary');b.disabled=true;try{const {data,error}=await window.SAMARA_DB.auth.signInWithPassword({email:email(val('loginId')),password:val('loginPassword')});if(error)throw error;me=await profile(data.user.id);if(!me.active)throw new Error('Account inactive');await openApp()}catch(e){alert(e.message)}finally{b.disabled=false}}
async function logout(){await window.SAMARA_DB.auth.signOut();location.reload()} async function changeMyPassword(){const p=prompt('New password (minimum 6 characters)');if(!p)return;const {error}=await window.SAMARA_DB.auth.updateUser({password:p});alert(error?error.message:'Password changed')}
async function openApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userName').textContent=me.name;$('userRole').textContent=me.role;$('avatar').textContent=me.name[0];$('today').textContent=new Date().toLocaleString('en-IN',{dateStyle:'full',timeStyle:'short'});$('nav').innerHTML=access[me.role].map(x=>`<button id="nav-${x}" onclick="go('${x}')"><span>${labels[x]}</span></button>`).join('');await reloadAll();subscribe();go('dashboard')}
async function reloadAll(){$('syncState').textContent='Syncing…';const qs=[window.SAMARA_DB.from('profiles').select('id,login_id,full_name,role,active'),window.SAMARA_DB.from('patients').select('*').order('created_at'),window.SAMARA_DB.from('care_records').select('*').order('recorded_at'),window.SAMARA_DB.from('vital_signs').select('*').order('recorded_at'),window.SAMARA_DB.from('medicine_records').select('*').order('created_at'),window.SAMARA_DB.from('meal_records').select('*').order('recorded_at'),window.SAMARA_DB.from('billing_transactions').select('*').order('recorded_at')];const r=await Promise.all(qs);const er=r.find(x=>x.error)?.error;if(er)throw er;const arr=r.map(x=>x.data||[]);USERS={};arr[0].forEach(p=>USERS[p.id]={id:p.login_id,name:p.full_name,role:p.role,active:p.active});[patients,care,vitals,meds,meals,bills]=arr.slice(1);$('syncState').textContent='Live';render()}
function subscribe(){channel=window.SAMARA_DB.channel('samara-live');['patients','care_records','vital_signs','medicine_records','meal_records','billing_transactions'].forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>reloadAll()));channel.subscribe(s=>{$('syncState').textContent=s==='SUBSCRIBED'?'Live':'Connecting…'})}
function go(x){page=x;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('nav-'+x)?.classList.add('active');$('topTitle').textContent=labels[x];if(x==='employees')loadUsers().then(render);else render()} function render(){$('content').innerHTML=(window['render_'+page]||(()=>''))()}
function metric(a,b,c,d='info'){return `<div class="card metric"><div class="label">${a}</div><div class="value ${d}">${b}</div><div class="sub muted">${c}</div></div>`} function balance(pid){return bills.filter(x=>x.patient_id===pid).reduce((a,x)=>a+(x.transaction_type==='Charge'?Number(x.amount):-Number(x.amount)),0)}
function render_dashboard(){const active=patients.filter(x=>x.status==='Active').length,pending=meds.filter(x=>x.status==='Pending').length,out=patients.reduce((a,p)=>a+Math.max(0,balance(p.id)),0),critical=vitals.filter(x=>x.alert==='Critical').length;return `<div class="page-title"><div><h2>Management Dashboard</h2><div class="muted">Shared live operational overview</div></div><button class="mini" onclick="reloadAll()">Refresh</button></div><div class="cards">${metric('Total Beds',25,'Facility capacity')}${metric('Occupied Beds',active,`${25-active} available`,'ok')}${metric('Medicines Due',pending,'Pending doses',pending?'warn':'ok')}${metric('Outstanding',money(out),'Patient receivables','bad')}</div><div class="grid2"><div class="card"><h3>Alerts</h3><div class="list"><div class="item"><span>${pending} medicine dose(s) pending</span><span class="tag amber">Action</span></div><div class="item"><span>${critical} critical vital reading(s)</span><span class="tag red">Critical</span></div></div></div><div class="card"><h3>Recent Activity</h3><div class="list">${[...care.slice(-3),...vitals.slice(-3)].sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at)).slice(0,5).map(x=>`<div class="item"><span><b>${esc(pName(x.patient_id))}</b><br><small>${esc(x.activity||('BP '+(x.bp||'-')+', SpO₂ '+(x.spo2||'-')+'%'))}</small></span><small>${dt(x.recorded_at)}</small></div>`).join('')||'<div class="empty">No activity yet</div>'}</div></div></div>`}
function render_patients(){return `<div class="page-title"><div><h2>Patients</h2><div class="muted">Central patient register</div></div>${['Admin','Manager','Nurse'].includes(me.role)?'<button class="primary" onclick="patientForm()">+ Add Patient</button>':''}</div><div class="table-wrap"><table><thead><tr><th>No.</th><th>Patient</th><th>Room</th><th>Admission</th><th>Care</th><th>Outstanding</th><th>Status</th></tr></thead><tbody>${patients.map(p=>`<tr><td>${esc(p.patient_no)}</td><td><b>${esc(p.full_name)}</b><div class="muted">${esc(p.diagnosis||'')}</div></td><td>${esc(p.room_bed||'-')}</td><td>${esc(p.admission_date)}</td><td>${esc(p.care_level)}</td><td>${money(Math.max(0,balance(p.id)))}</td><td><span class="tag ${p.status==='Active'?'green':'red'}">${esc(p.status)}</span></td></tr>`).join('')}</tbody></table></div>`}
function patientForm(){modal(`<div class="modal-head"><h3>New Patient</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid">${field('Patient Number','p_no')}${field('Full Name','p_name')}${field('Age','p_age','number')}${select('Gender','p_gender',['Male','Female','Other'])}${field('Room / Bed','p_room')}${field('Admission Date','p_date','date')}${field('Diagnosis','p_diag')}${field('Emergency Contact','p_contact')}${select('Care Level','p_care',['Independent','Assisted','High Dependency'])}<div class="field full right"><button class="primary" onclick="addPatient()">Save Patient</button></div></div>`)} async function addPatient(){const row={patient_no:val('p_no'),full_name:val('p_name'),age:+val('p_age')||null,gender:val('p_gender'),room_bed:val('p_room'),admission_date:val('p_date')||new Date().toISOString().slice(0,10),diagnosis:val('p_diag'),emergency_contact:val('p_contact'),care_level:val('p_care'),status:'Active',created_by:me.uid};const {error}=await window.SAMARA_DB.from('patients').insert(row);if(error)return alert(error.message);closeModal()}
function render_beds(){const used=new Map(patients.filter(p=>p.status==='Active').map(p=>[p.room_bed,p.full_name]));return `<div class="page-title"><div><h2>Rooms & Beds</h2><div class="muted">Live occupancy</div></div></div><div class="bed-grid">${Array.from({length:25},(_,i)=>{const room=`${101+Math.floor(i/2)}-${i%2?'B':'A'}`,name=used.get(room);return `<div class="bed ${name?'occupied':'available'}"><b>${room}</b><small>${name?esc(name):'Available'}</small></div>`}).join('')}</div>`}
function entryPage(title,sub,form,heads,rows){return `<div class="page-title"><div><h2>${title}</h2><div class="muted">${sub}</div></div></div><div class="grid2"><div class="card"><h3>New Entry</h3>${form}</div><div class="card"><h3>Recent Records</h3><div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="empty">No records</td></tr>`}</tbody></table></div></div></div>`}
function pSelect(id){return `<div class="field"><label>Patient</label><select id="${id}">${patients.filter(p=>p.status==='Active').map(p=>`<option value="${p.id}">${esc(p.full_name)} · ${esc(p.room_bed||'-')}</option>`).join('')}</select></div>`} function field(l,id,t='text'){return `<div class="field"><label>${l}</label><input id="${id}" type="${t}"></div>`} function select(l,id,opts){return `<div class="field"><label>${l}</label><select id="${id}">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`}
function render_care(){return entryPage('Daily Care','Shared care activity records',`<div class="form-grid">${pSelect('c_p')}${select('Activity','c_a',['Bathing','Dressing','Mobility','Toileting','Wound Care','Physiotherapy','General Observation'])}${select('Status','c_s',['Completed','Pending','Refused'])}${field('Notes','c_n')}<div class="field full right"><button class="primary" onclick="addCare()">Save</button></div></div>`,['Patient','Activity','Status','By','Time'],care.slice().reverse().map(x=>`<tr><td>${esc(pName(x.patient_id))}</td><td>${esc(x.activity)}</td><td>${esc(x.status)}</td><td>${esc(who(x.recorded_by))}</td><td>${dt(x.recorded_at)}</td></tr>`).join(''))} async function addCare(){const {error}=await window.SAMARA_DB.from('care_records').insert({patient_id:val('c_p'),activity:val('c_a'),status:val('c_s'),notes:val('c_n')});if(error)alert(error.message)}
function render_vitals(){return entryPage('Vital Signs','Clinical observations',`<div class="form-grid">${pSelect('v_p')}${field('Blood Pressure','v_bp')}${field('Pulse','v_pulse','number')}${field('Temperature °C','v_temp','number')}${field('SpO₂ %','v_spo2','number')}<div class="field full right"><button class="primary" onclick="addVitals()">Save</button></div></div>`,['Patient','BP','Pulse','Temp','SpO₂','Alert','Time'],vitals.slice().reverse().map(x=>`<tr><td>${esc(pName(x.patient_id))}</td><td>${esc(x.bp||'-')}</td><td>${x.pulse||'-'}</td><td>${x.temperature||'-'}</td><td>${x.spo2||'-'}%</td><td><span class="tag ${x.alert==='Critical'?'red':'green'}">${x.alert}</span></td><td>${dt(x.recorded_at)}</td></tr>`).join(''))} async function addVitals(){const spo=+val('v_spo2')||null,alert=spo&&spo<92?'Critical':'Normal';const {error}=await window.SAMARA_DB.from('vital_signs').insert({patient_id:val('v_p'),bp:val('v_bp'),pulse:+val('v_pulse')||null,temperature:+val('v_temp')||null,spo2:spo,alert});if(error)alert(error.message)}
function render_medicines(){return entryPage('Medicines','Medication schedule and administration',`<div class="form-grid">${pSelect('m_p')}${field('Medicine & Dose','m_name')}${field('Scheduled Time','m_time','time')}${select('Status','m_status',['Pending','Given','Missed','Refused'])}<div class="field full right"><button class="primary" onclick="addMed()">Add</button></div></div>`,['Patient','Medicine','Time','Status','Action'],meds.slice().reverse().map(x=>`<tr><td>${esc(pName(x.patient_id))}</td><td>${esc(x.medicine)}</td><td>${esc(x.scheduled_time||'')}</td><td>${esc(x.status)}</td><td>${x.status==='Pending'?`<button class="mini" onclick="giveMed('${x.id}')">Mark Given</button>`:''}</td></tr>`).join(''))} async function addMed(){const {error}=await window.SAMARA_DB.from('medicine_records').insert({patient_id:val('m_p'),medicine:val('m_name'),scheduled_time:val('m_time')||null,status:val('m_status')});if(error)alert(error.message)} async function giveMed(id){const {error}=await window.SAMARA_DB.from('medicine_records').update({status:'Given',administered_by:me.uid,administered_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message)}
function render_food(){return entryPage('Food & Diet','Meal consumption shared with care team',`<div class="form-grid">${pSelect('f_p')}${select('Meal','f_m',['Breakfast','Lunch','Evening Snack','Dinner'])}${select('Diet Type','f_d',['Normal','Diabetic','Soft','Liquid','Renal','High Protein'])}${select('Consumption','f_c',['Fully Consumed','Partially Consumed','Refused','Not Served'])}<div class="field full right"><button class="primary" onclick="addMeal()">Save</button></div></div>`,['Patient','Meal','Diet','Consumption','By','Time'],meals.slice().reverse().map(x=>`<tr><td>${esc(pName(x.patient_id))}</td><td>${esc(x.meal)}</td><td>${esc(x.diet_type)}</td><td>${esc(x.consumption)}</td><td>${esc(who(x.recorded_by))}</td><td>${dt(x.recorded_at)}</td></tr>`).join(''))} async function addMeal(){const {error}=await window.SAMARA_DB.from('meal_records').insert({patient_id:val('f_p'),meal:val('f_m'),diet_type:val('f_d'),consumption:val('f_c')});if(error)alert(error.message)}
function render_billing(){return entryPage('Billing & Payments','Shared financial ledger',`<div class="form-grid">${pSelect('b_p')}${select('Transaction','b_t',['Charge','Payment'])}${field('Amount ₹','b_a','number')}${field('Description','b_d')}<div class="field full right"><button class="primary" onclick="addBill()">Save</button></div></div>`,['Patient','Type','Amount','Description','By','Time'],bills.slice().reverse().map(x=>`<tr><td>${esc(pName(x.patient_id))}</td><td>${esc(x.transaction_type)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td><td>${esc(who(x.recorded_by))}</td><td>${dt(x.recorded_at)}</td></tr>`).join(''))} async function addBill(){const {error}=await window.SAMARA_DB.from('billing_transactions').insert({patient_id:val('b_p'),transaction_type:val('b_t'),amount:+val('b_a'),description:val('b_d')});if(error)alert(error.message)}
async function loadUsers(){if(me.role!=='Admin')return;const {data,error}=await window.SAMARA_DB.functions.invoke('admin-users',{body:{action:'list'}});if(error)return alert(error.message);USERS={};(data.users||[]).forEach(p=>USERS[p.id]={id:p.login_id,name:p.full_name,role:p.role,employeeId:p.employee_id,active:p.active})}
function render_employees(){return `<div class="page-title"><div><h2>Employees</h2><div class="muted">Central cloud accounts</div></div><button class="primary" onclick="userForm()">+ Add User</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>ID</th><th>Role</th><th>Login</th><th>Status</th></tr></thead><tbody>${Object.values(USERS).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.employeeId||'-')}</td><td>${esc(u.role)}</td><td>${esc(u.id)}</td><td>${u.active?'Active':'Inactive'}</td></tr>`).join('')}</tbody></table></div>`} function userForm(){modal(`<div class="modal-head"><h3>Create Employee</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid">${field('Name','u_n')}${field('Employee ID','u_e')}${field('Mobile','u_m')}${select('Role','u_r',['Admin','Manager','Nurse','Caregiver','Accounts','Kitchen'])}${field('Login ID','u_l')}${field('Temporary Password','u_p','password')}<div class="field full right"><button class="primary" onclick="createUser()">Create</button></div></div>`)} async function createUser(){const {data,error}=await window.SAMARA_DB.functions.invoke('admin-users',{body:{action:'create',fullName:val('u_n'),employeeId:val('u_e'),mobile:val('u_m'),role:val('u_r'),loginId:val('u_l'),password:val('u_p')}});if(error||data?.error)return alert(error?.message||data.error);closeModal();await loadUsers();render();alert('Employee can now sign in from any device.')}
function render_reports(){return `<div class="page-title"><div><h2>Reports</h2><div class="muted">Live summaries</div></div><button class="primary" onclick="window.print()">Print</button></div><div class="cards">${metric('Active Patients',patients.filter(p=>p.status==='Active').length,'Current census')}${metric('Care Entries',care.length,'All recorded')}${metric('Medicine Compliance',meds.length?Math.round(meds.filter(m=>m.status==='Given').length/meds.length*100)+'%':'0%','Given doses','ok')}${metric('Outstanding',money(patients.reduce((a,p)=>a+Math.max(0,balance(p.id)),0)),'All patients','bad')}</div><div class="card" style="margin-top:16px"><h3>Outstanding Statement</h3><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Room</th><th>Outstanding</th></tr></thead><tbody>${patients.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.room_bed||'-')}</td><td>${money(Math.max(0,balance(p.id)))}</td></tr>`).join('')}</tbody></table></div></div>`}
function modal(h){$('modalRoot').innerHTML=`<div class="modal"><div class="modal-card">${h}</div></div>`} function closeModal(){$('modalRoot').innerHTML=''}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(console.error);
(async()=>{if(!ENABLED){$('loginHelp').innerHTML='<b>Setup required</b><br>Add Supabase URL and public key in config.js.';return}const {data}=await window.SAMARA_DB.auth.getSession();if(data.session){try{me=await profile(data.session.user.id);await openApp()}catch(e){console.error(e)}}})();
</script></body></html>
